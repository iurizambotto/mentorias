# The batch shape of data engineering: a Job runs to completion and goes away.
# This is what the Airflow KubernetesPodOperator creates for each task.
apiVersion: batch/v1
kind: Job
metadata:
  name: transformacao-diaria
  namespace: campanhas
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      # The worker node carries the label declared in kind-cluster.yaml.
      nodeSelector:
        workload: batch
      securityContext:
        # 65534 is `nobody`. The script only reads and prints, so it needs
        # nothing that root would give it.
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transformacao
          image: alpine:3.22
          command: ["/bin/sh", "/etc/etl/transformar.sh"]
          envFrom:
            - configMapRef:
                name: parametros-etl
          env:
            - name: TOKEN_DO_LAKE
              valueFrom:
                secretKeyRef:
                  name: credenciais-do-lake
                  key: TOKEN_DO_LAKE
          volumeMounts:
            - name: script
              mountPath: /etc/etl
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: parametros-etl
            items:
              - key: transformar.sh
                path: transformar.sh
