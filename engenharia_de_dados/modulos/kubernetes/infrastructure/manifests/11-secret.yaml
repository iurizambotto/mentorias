# A Secret in the cluster is base64, not encryption. Anyone who can read the
# object reads the value. What protects it is RBAC plus encryption at rest in
# etcd. This file exists to be read in the lab, and the value is a placeholder.
#
# In production this object does not live in Git. It comes from a secrets
# manager, through the External Secrets Operator or an equivalent.
apiVersion: v1
kind: Secret
metadata:
  name: credenciais-do-lake
  namespace: campanhas
type: Opaque
stringData:
  TOKEN_DO_LAKE: "valor-de-exemplo-trocar-no-ambiente-real"
