apiVersion: v1
kind: Namespace
metadata:
  name: campanhas
  labels:
    # Pod Security Admission at its strictest profile. Every workload in this
    # namespace complies, so `restricted` can be enforced instead of only warned.
    # Migrating a real namespace starts with `warn` and `audit`, and only then
    # moves to `enforce`.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
